# Free Render web service for the Flask API + committed SQLite database.
# Connect this repo at https://dashboard.render.com → New → Blueprint
services:
  - type: web
    name: olympiad-exams-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 1 -k gthread --threads 4 -b 0.0.0.0:$PORT wsgi:app
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DATABASE_PATH
        value: data/marks.db
      - key: UPLOAD_DIR
        value: data/uploads
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        value: Ameen@0805
